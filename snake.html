<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="index" href="index.html">
  <link rel="stylesheet" href="style/style_snake.css">
</head>

<body>

  <header>
    <h1>SNAKE</h1>
    <a href="index.html">Accueil</a>
  </header>


  <div id="hud">
    SCORE: <span id="score-val">0</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    BEST:  <span id="best-val">0</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <div id="overlay" class="start">
      <h2>SNAKE</h2>
      <p>Flèches clavier ou<br>pavé directionnel<br>pour diriger le serpent</p>
      <button id="start-btn">JOUER</button>
    </div>
  </div>

  <!-- D-Pad -->
  <div id="dpad" aria-label="Contrôles directionnels">
    <button class="dpad-btn" id="btn-up"    aria-label="Haut">▲</button>
    <button class="dpad-btn" id="btn-left"  aria-label="Gauche">◀</button>
    <div    class="dpad-btn dpad-center" id="btn-center"></div>
    <button class="dpad-btn" id="btn-right" aria-label="Droite">▶</button>
    <button class="dpad-btn" id="btn-down"  aria-label="Bas">▼</button>
  </div>

  <p id="hint">↑ ← ↓ → ou pavé ci-dessus</p>

  <script>
  (() => {
    /* ── Config ── */
    const COLS = 20, ROWS = 20, CELL = 24;
    const SPEEDS = [160, 140, 120, 100, 85, 72]; // ms / tick selon score

    const canvas  = document.getElementById('c');
    const ctx     = canvas.getContext('2d');
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;

    const overlay   = document.getElementById('overlay');
    const startBtn  = document.getElementById('start-btn');
    const scoreEl   = document.getElementById('score-val');
    const bestEl    = document.getElementById('best-val');

    /* ── Couleurs CSS ── */
    const cs = getComputedStyle(document.documentElement);
    const C = {
      bg:       cs.getPropertyValue('--bg').trim(),
      panel:    cs.getPropertyValue('--panel').trim(),
      border:   cs.getPropertyValue('--border').trim(),
      green:    cs.getPropertyValue('--green').trim(),
      greenDim: cs.getPropertyValue('--green-dim').trim(),
      red:      cs.getPropertyValue('--red').trim(),
      grey:     cs.getPropertyValue('--grey').trim(),
    };

    /* ── State ── */
    let snake, dir, nextDir, food, score, best = 0, loop, running = false;

    if (localStorage.bestSnake) {
        best = localStorage.bestSnake;
        bestEl.textContent = localStorage.bestSnake
        console.log(best)
      };

    function speedFor(s) {
      if (s < 5)  return SPEEDS[0];
      if (s < 10) return SPEEDS[1];
      if (s < 20) return SPEEDS[2];
      if (s < 35) return SPEEDS[3];
      if (s < 55) return SPEEDS[4];
      return SPEEDS[5];
    }

    /* ── Init ── */
    function init() {
      snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir     = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score   = 0;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    /* ── Game Loop ── */
    function startGame() {
      overlay.classList.add('hidden');
      running = true;
      init();
      drawAll();
      scheduleNext();
    }

    function scheduleNext() {
      loop = setTimeout(tick, speedFor(score));
    }

    function tick() {
      if (!running) return;
      dir = { ...nextDir };

      const head = { x: (snake[0].x + dir.x + COLS) % COLS,
                     y: (snake[0].y + dir.y + ROWS) % ROWS };

      // Collision avec soi-même
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score; bestEl.textContent = best;
          localStorage.bestSnake = best;
        }
        placeFood();
      } else {
        snake.pop();
      }

      drawAll();
      scheduleNext();
    }

    function gameOver() {
      running = false;
      clearTimeout(loop);
      overlay.classList.remove('hidden', 'start');
      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p>Score : ${score}<br>Meilleur : ${best}</p>
        <button id="start-btn">REJOUER</button>`;
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    /* ── Dessin ── */
    function drawAll() {
      // Fond
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grille subtile
      ctx.strokeStyle = C.panel;
      ctx.lineWidth = .5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // Nourriture
      drawFood();

      // Serpent
      snake.forEach((seg, i) => drawSeg(seg, i));
    }

    function drawFood() {
      const x = food.x * CELL, y = food.y * CELL, m = 4;
      // Halo
      ctx.shadowColor   = C.red;
      ctx.shadowBlur    = 14;
      ctx.fillStyle     = C.red;
      ctx.beginPath();
      ctx.roundRect(x + m, y + m, CELL - m*2, CELL - m*2, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawSeg(seg, i) {
      const x = seg.x * CELL, y = seg.y * CELL, m = 2;
      const isHead = i === 0;
      ctx.shadowColor = isHead ? C.green : 'transparent';
      ctx.shadowBlur  = isHead ? 12 : 0;
      const alpha     = isHead ? 1 : Math.max(0.35, 1 - i * (0.6 / snake.length));
      ctx.fillStyle   = isHead ? C.green : C.greenDim;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.roundRect(x + m, y + m, CELL - m*2, CELL - m*2, isHead ? 5 : 3);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur  = 0;

      // Yeux sur la tête
      if (isHead) {
        ctx.fillStyle = C.bg;
        const eyeSize = 3, ex = x + CELL/2, ey = y + CELL/2;
        const [e1, e2] = eyePos(ex, ey, eyeSize);
        ctx.beginPath(); ctx.arc(e1.x, e1.y, eyeSize/2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2.x, e2.y, eyeSize/2, 0, Math.PI*2); ctx.fill();
      }
    }

    function eyePos(cx, cy, s) {
      const off = 5;
      if (dir.x === 1)  return [{ x: cx+s, y: cy-off }, { x: cx+s, y: cy+off }];
      if (dir.x === -1) return [{ x: cx-s, y: cy-off }, { x: cx-s, y: cy+off }];
      if (dir.y === -1) return [{ x: cx-off, y: cy-s }, { x: cx+off, y: cy-s }];
                        return [{ x: cx-off, y: cy+s }, { x: cx+off, y: cy+s }];
    }

    /* ── Contrôles clavier ── */
    const KEY_MAP = {
      ArrowUp:    { x:  0, y: -1 },
      ArrowDown:  { x:  0, y:  1 },
      ArrowLeft:  { x: -1, y:  0 },
      ArrowRight: { x:  1, y:  0 },
    };

    document.addEventListener('keydown', e => {
      if (!running) return;
      const d = KEY_MAP[e.key];
      if (!d) return;
      e.preventDefault();
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d; // pas demi-tour
    });

    /* ── Contrôles D-Pad ── */
    const DPAD = {
      'btn-up':    { x:  0, y: -1 },
      'btn-down':  { x:  0, y:  1 },
      'btn-left':  { x: -1, y:  0 },
      'btn-right': { x:  1, y:  0 },
    };

    function handleDpad(id) {
      if (!running) return;
      const d = DPAD[id];
      if (!d) return;
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;

      // Feedback visuel
      const btn = document.getElementById(id);
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 150);
    }

    Object.keys(DPAD).forEach(id => {
      const btn = document.getElementById(id);
      // Souris
      btn.addEventListener('click', () => handleDpad(id));
      // Touch
      btn.addEventListener('touchstart', e => { e.preventDefault(); handleDpad(id); }, { passive: false });
    });

    /* ── Démarrage ── */
    startBtn.addEventListener('click', startGame);

    // Dessin initial (grille vide)
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  })();
  </script>
</body>
</html>
